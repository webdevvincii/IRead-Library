<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Borrows - Library Member Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-gray-100">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center">
                        <h1 class="text-lg sm:text-xl font-bold text-blue-600">📚 Library MS</h1>
                    </div>
                    <button id="mobileNavBtn" class="md:hidden ml-4 text-gray-600">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                    <div id="desktopNav" class=" md:flex md:space-x-4 lg:space-x-8 md:ml-6">
                        <a href="dashboard.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium whitespace-nowrap">Home</a>
                        <a href="books.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium whitespace-nowrap">Books</a>
                        <a href="my-borrows.html" class="border-blue-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium whitespace-nowrap">My Borrows</a>
                        <a href="reservations.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium whitespace-nowrap">Reservation</a>
                        <a href="fines.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium whitespace-nowrap">Fines</a>
                    </div>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <div class="relative hidden md:block">
                        <button id="notificationBtn" class="p-2 rounded-full text-gray-400 hover:text-gray-500 relative">
                            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                            </svg>
                            <span id="notificationBadge" class="hidden absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full"></span>
                        </button>
                    </div>
                    <span id="userName" class="text-xs sm:text-sm text-gray-700 hidden sm:inline"></span>
                    <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white px-3 sm:px-4 py-2 rounded-md text-sm font-medium">
                        <svg class="h-5 w-5 inline-block md:mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        <span class="hidden md:inline">Logout</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Navigation Menu -->
        <div id="mobileNav" class="hidden md:hidden border-t border-gray-200 bg-white">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="dashboard.html" class="border-l-4 border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 text-base font-medium">
                    🏠 Home
                </a>
                <a href="books.html" class="border-l-4 border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 text-base font-medium">
                    📚 Books
                </a>
                <a href="my-borrows.html" class="bg-blue-50 border-l-4 border-blue-500 text-blue-700 block pl-3 pr-4 py-2 text-base font-medium">
                    📖 My Borrows
                </a>
                <a href="reservations.html" class="border-l-4 border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 text-base font-medium">
                    🔖 Reservation
                </a>
                <a href="fines.html" class="border-l-4 border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 text-base font-medium">
                    💰 Fines
                </a>
                <div class="border-t border-gray-200 pt-2 mt-2">
                    <div class="px-3 py-2">
                        <span id="mobileUserName" class="text-sm text-gray-700 block mb-2 font-medium"></span>
                        <button id="mobileLogoutBtn" class="w-full bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md text-sm font-medium flex items-center justify-center">
                            <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                            </svg>
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">My Borrows</h2>
        
        <!-- Tab Navigation -->
        <div class="bg-white rounded-lg shadow mb-6">
            <div class="border-b border-gray-200">
                <nav class="-mb-px flex space-x-8 px-6" aria-label="Tabs">
                    <button onclick="switchTab('pending')" id="tab-pending" class="tab-button border-blue-500 text-blue-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                        Pending Requests
                    </button>
                    <button onclick="switchTab('active')" id="tab-active" class="tab-button border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                        Active Borrows
                    </button>
                    <button onclick="switchTab('history')" id="tab-history" class="tab-button border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                        History
                    </button>
                </nav>
            </div>
        </div>

        <!-- Pending Requests -->
        <div id="content-pending" class="tab-content">
            <div id="pendingGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="text-center py-8 text-gray-500 col-span-full">
                    <i class="fas fa-spinner fa-spin mr-2"></i>Loading pending requests...
                </div>
            </div>
        </div>

        <!-- Active Borrows -->
        <div id="content-active" class="tab-content hidden">
            <div id="activeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="text-center py-8 text-gray-500 col-span-full">
                    <i class="fas fa-spinner fa-spin mr-2"></i>Loading active borrows...
                </div>
            </div>
        </div>

        <!-- History -->
        <div id="content-history" class="tab-content hidden">
            <div id="historyGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="text-center py-8 text-gray-500 col-span-full">
                    <i class="fas fa-spinner fa-spin mr-2"></i>Loading history...
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="js/mobile-menu.js"></script>
    <script>
        let currentUser = null;
        let currentTab = 'pending';

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            await loadBorrows();
        });

        async function checkAuth() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }
                
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', session.user.id)
                    .single();
                
                if (!profile || profile.role !== 'member') {
                    window.location.href = 'login.html';
                    return;
                }
                
                currentUser = profile;
                document.getElementById('userName').textContent = profile.full_name || profile.email;
                
                document.getElementById('logoutBtn').addEventListener('click', async () => {
                    await supabase.auth.signOut();
                    window.location.href = 'login.html';
                });
            } catch (error) {
                console.error('Auth error:', error);
                window.location.href = 'login.html';
            }
        }

        async function loadBorrows() {
            await loadPendingRequests();
            await loadActiveBorrows();
            await loadHistory();
        }

        async function loadPendingRequests() {
            try {
                const { data, error } = await supabase
                    .from('borrow_requests')
                    .select('*, books(*)')
                    .eq('member_id', currentUser.id)
                    .eq('status', 'pending')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const grid = document.getElementById('pendingGrid');
                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="text-center py-8 text-gray-500 col-span-full"><i class="fas fa-inbox mr-2"></i>No pending requests</div>';
                    return;
                }

                grid.innerHTML = data.map(request => {
                    const startDate = new Date(request.requested_start_date);
                    const endDate = new Date(startDate);
                    endDate.setDate(endDate.getDate() + request.requested_duration);
                    
                    return `
                        <div class="bg-white rounded-lg shadow-md overflow-hidden">
                            <div class="p-6">
                                <div class="flex items-start justify-between mb-3">
                                    <span class="px-2 py-1 text-xs rounded-full bg-yellow-100 text-yellow-800">Pending Approval</span>
                                    <span class="text-xs text-gray-500">${request.request_number}</span>
                                </div>
                                <h3 class="text-lg font-bold text-gray-900 mb-2">${request.books.title}</h3>
                                <p class="text-sm text-gray-600 mb-1">by ${request.books.author}</p>
                                <p class="text-xs text-gray-500 mb-3">ISBN: ${request.books.isbn}</p>
                                <div class="border-t pt-3 mt-3 space-y-1 text-sm">
                                    <p><span class="font-medium">Start:</span> ${startDate.toLocaleDateString()}</p>
                                    <p><span class="font-medium">Duration:</span> ${request.requested_duration} days</p>
                                    <p><span class="font-medium">Due:</span> ${endDate.toLocaleDateString()}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading pending requests:', error);
                document.getElementById('pendingGrid').innerHTML = '<div class="text-center py-8 text-red-500 col-span-full">Error loading requests</div>';
            }
        }

        async function loadActiveBorrows() {
            try {
                const { data, error } = await supabase
                    .from('borrow_records')
                    .select('*, books(*)')
                    .eq('member_id', currentUser.id)
                    .in('status', ['active', 'overdue'])
                    .order('borrow_date', { ascending: false });

                if (error) throw error;

                const grid = document.getElementById('activeGrid');
                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="text-center py-8 text-gray-500 col-span-full"><i class="fas fa-inbox mr-2"></i>No active borrows</div>';
                    return;
                }

                grid.innerHTML = data.map(borrow => {
                    const dueDate = new Date(borrow.due_date);
                    const today = new Date();
                    const isOverdue = today > dueDate;
                    const daysRemaining = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
                    
                    return `
                        <div class="bg-white rounded-lg shadow-md overflow-hidden ${isOverdue ? 'border-2 border-red-500' : ''}">
                            <div class="p-6">
                                <div class="flex items-start justify-between mb-3">
                                    <span class="px-2 py-1 text-xs rounded-full ${isOverdue ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800'}">
                                        ${isOverdue ? 'Overdue' : 'Active'}
                                    </span>
                                </div>
                                <h3 class="text-lg font-bold text-gray-900 mb-2">${borrow.books.title}</h3>
                                <p class="text-sm text-gray-600 mb-1">by ${borrow.books.author}</p>
                                <p class="text-xs text-gray-500 mb-3">ISBN: ${borrow.books.isbn}</p>
                                <div class="border-t pt-3 mt-3 space-y-1 text-sm">
                                    <p><span class="font-medium">Borrowed:</span> ${new Date(borrow.borrow_date).toLocaleDateString()}</p>
                                    <p><span class="font-medium">Due:</span> ${dueDate.toLocaleDateString()}</p>
                                    <p class="${isOverdue ? 'text-red-600 font-semibold' : 'text-gray-600'}">
                                        ${isOverdue ? `Overdue by ${Math.abs(daysRemaining)} days` : `${daysRemaining} days remaining`}
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading active borrows:', error);
                document.getElementById('activeGrid').innerHTML = '<div class="text-center py-8 text-red-500 col-span-full">Error loading borrows</div>';
            }
        }

        async function loadHistory() {
            try {
                const { data, error } = await supabase
                    .from('borrow_records')
                    .select('*, books(*)')
                    .eq('member_id', currentUser.id)
                    .eq('status', 'returned')
                    .order('return_date', { ascending: false })
                    .limit(20);

                if (error) throw error;

                const grid = document.getElementById('historyGrid');
                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="text-center py-8 text-gray-500 col-span-full"><i class="fas fa-inbox mr-2"></i>No borrow history</div>';
                    return;
                }

                grid.innerHTML = data.map(borrow => {
                    const returnedDate = new Date(borrow.return_date);
                    const dueDate = new Date(borrow.due_date);
                    const wasLate = returnedDate > dueDate;
                    
                    return `
                        <div class="bg-white rounded-lg shadow-md overflow-hidden">
                            <div class="p-6">
                                <div class="flex items-start justify-between mb-3">
                                    <span class="px-2 py-1 text-xs rounded-full ${wasLate ? 'bg-orange-100 text-orange-800' : 'bg-gray-100 text-gray-800'}">
                                        ${wasLate ? 'Returned Late' : 'Returned'}
                                    </span>
                                </div>
                                <h3 class="text-lg font-bold text-gray-900 mb-2">${borrow.books.title}</h3>
                                <p class="text-sm text-gray-600 mb-1">by ${borrow.books.author}</p>
                                <p class="text-xs text-gray-500 mb-3">ISBN: ${borrow.books.isbn}</p>
                                <div class="border-t pt-3 mt-3 space-y-1 text-sm">
                                    <p><span class="font-medium">Borrowed:</span> ${new Date(borrow.borrow_date).toLocaleDateString()}</p>
                                    <p><span class="font-medium">Returned:</span> ${returnedDate.toLocaleDateString()}</p>
                                    ${wasLate ? `<p class="text-orange-600 text-xs">Returned late</p>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('historyGrid').innerHTML = '<div class="text-center py-8 text-red-500 col-span-full">Error loading history</div>';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('border-blue-500', 'text-blue-600');
                btn.classList.add('border-transparent', 'text-gray-500');
            });
            document.getElementById(`tab-${tab}`).classList.remove('border-transparent', 'text-gray-500');
            document.getElementById(`tab-${tab}`).classList.add('border-blue-500', 'text-blue-600');
            
            // Update content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            document.getElementById(`content-${tab}`).classList.remove('hidden');
        }
    </script>
</body>
</html>
