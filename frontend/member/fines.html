<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fines - Library Member Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-gray-100">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center">
                        <h1 class="text-lg sm:text-xl font-bold text-blue-600">📚 Library MS</h1>
                    </div>
                    <button id="mobileNavBtn" class="md:hidden ml-4 text-gray-600">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                    <div id="desktopNav" class=" md:flex md:space-x-4 lg:space-x-8 md:ml-6">
                        <a href="dashboard.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium whitespace-nowrap">Home</a>
                        <a href="books.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium whitespace-nowrap">Books</a>
                        <a href="my-borrows.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium whitespace-nowrap">My Borrows</a>
                        <a href="reservations.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium whitespace-nowrap">Reservation</a>
                        <a href="fines.html" class="border-blue-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium whitespace-nowrap">Fines</a>
                    </div>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <div class="relative hidden md:block">
                        <button id="notificationBtn" class="p-2 rounded-full text-gray-400 hover:text-gray-500 relative">
                            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                            </svg>
                            <span id="notificationBadge" class="hidden absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full"></span>
                        </button>
                    </div>
                    <span id="userName" class="text-xs sm:text-sm text-gray-700 hidden sm:inline"></span>
                    <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white px-3 sm:px-4 py-2 rounded-md text-sm font-medium">
                        <svg class="h-5 w-5 inline-block md:mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        <span class="hidden md:inline">Logout</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Navigation Menu -->
        <div id="mobileNav" class="hidden md:hidden border-t border-gray-200 bg-white">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="dashboard.html" class="border-l-4 border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 text-base font-medium">
                    🏠 Home
                </a>
                <a href="books.html" class="border-l-4 border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 text-base font-medium">
                    📚 Books
                </a>
                <a href="my-borrows.html" class="border-l-4 border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 text-base font-medium">
                    📖 My Borrows
                </a>
                <a href="reservations.html" class="border-l-4 border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 text-base font-medium">
                    🔖 Reservation
                </a>
                <a href="fines.html" class="bg-blue-50 border-l-4 border-blue-500 text-blue-700 block pl-3 pr-4 py-2 text-base font-medium">
                    💰 Fines
                </a>
                <div class="border-t border-gray-200 pt-2 mt-2">
                    <div class="px-3 py-2">
                        <span id="mobileUserName" class="text-sm text-gray-700 block mb-2 font-medium"></span>
                        <button id="mobileLogoutBtn" class="w-full bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md text-sm font-medium flex items-center justify-center">
                            <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                            </svg>
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">My Fines</h2>
        
        <!-- Summary Card -->
        <div class="bg-gradient-to-r from-red-500 to-red-700 rounded-lg shadow-lg p-6 mb-8 text-white">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <p class="text-red-100 text-sm mb-1">Total Fines</p>
                    <p class="text-3xl font-bold">₱<span id="totalFines">0.00</span></p>
                </div>
                <div>
                    <p class="text-red-100 text-sm mb-1">Total Paid</p>
                    <p class="text-3xl font-bold">₱<span id="totalPaid">0.00</span></p>
                </div>
                <div>
                    <p class="text-red-100 text-sm mb-1">Outstanding Balance</p>
                    <p class="text-3xl font-bold">₱<span id="outstanding">0.00</span></p>
                </div>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="bg-white rounded-lg shadow mb-6">
            <div class="border-b border-gray-200">
                <nav class="-mb-px flex space-x-8 px-6" aria-label="Tabs">
                    <button onclick="switchTab('unpaid')" id="tab-unpaid" class="tab-button border-red-500 text-red-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                        Unpaid Fines
                    </button>
                    <button onclick="switchTab('paid')" id="tab-paid" class="tab-button border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
                        Payment History
                    </button>
                </nav>
            </div>
        </div>

        <!-- Unpaid Fines -->
        <div id="content-unpaid" class="tab-content">
            <div id="unpaidGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="text-center py-8 text-gray-500 col-span-full">
                    <i class="fas fa-spinner fa-spin mr-2"></i>Loading unpaid fines...
                </div>
            </div>
        </div>

        <!-- Payment History -->
        <div id="content-paid" class="tab-content hidden">
            <div id="paidGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="text-center py-8 text-gray-500 col-span-full">
                    <i class="fas fa-spinner fa-spin mr-2"></i>Loading payment history...
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>
    <script src="js/mobile-menu.js"></script>
    <script>
        let currentUser = null;
        let currentTab = 'unpaid';

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            await loadFines();
        });

        async function checkAuth() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    window.location.href = 'login.html';
                    return;
                }
                
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', session.user.id)
                    .single();
                
                if (!profile || profile.role !== 'member') {
                    window.location.href = 'login.html';
                    return;
                }
                
                currentUser = profile;
                document.getElementById('userName').textContent = profile.full_name || profile.email;
                
                document.getElementById('logoutBtn').addEventListener('click', async () => {
                    await supabase.auth.signOut();
                    window.location.href = 'login.html';
                });
            } catch (error) {
                console.error('Auth error:', error);
                window.location.href = 'login.html';
            }
        }

        async function loadFines() {
            await loadSummary();
            await loadUnpaidFines();
            await loadPaidFines();
        }

        async function loadSummary() {
            try {
                const { data, error } = await supabase
                    .from('fines')
                    .select('total_amount, paid_amount')
                    .eq('member_id', currentUser.id);

                if (error) throw error;

                const totalFines = data.reduce((sum, fine) => sum + (fine.total_amount || 0), 0);
                const totalPaid = data.reduce((sum, fine) => sum + (fine.paid_amount || 0), 0);
                const outstanding = totalFines - totalPaid;

                document.getElementById('totalFines').textContent = totalFines.toFixed(2);
                document.getElementById('totalPaid').textContent = totalPaid.toFixed(2);
                document.getElementById('outstanding').textContent = outstanding.toFixed(2);
            } catch (error) {
                console.error('Error loading summary:', error);
            }
        }

        async function loadUnpaidFines() {
            try {
                const { data, error } = await supabase
                    .from('fines')
                    .select('*, borrow_records(*, books(*))')
                    .eq('member_id', currentUser.id)
                    .neq('status', 'paid')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const grid = document.getElementById('unpaidGrid');
                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="text-center py-8 text-gray-500 col-span-full"><i class="fas fa-smile mr-2"></i>No unpaid fines - Keep it up!</div>';
                    return;
                }

                grid.innerHTML = data.map(fine => {
                    const balance = fine.total_amount - (fine.paid_amount || 0);
                    const book = fine.borrow_records?.books;
                    
                    return `
                        <div class="bg-white rounded-lg shadow-md overflow-hidden border-l-4 border-red-500">
                            <div class="p-6">
                                <div class="flex items-start justify-between mb-3">
                                    <span class="px-2 py-1 text-xs rounded-full ${fine.status === 'partial' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800'}">
                                        ${fine.status === 'partial' ? 'Partially Paid' : 'Unpaid'}
                                    </span>
                                    <span class="text-lg font-bold text-red-600">₱${balance.toFixed(2)}</span>
                                </div>
                                ${book ? `
                                    <h3 class="text-lg font-bold text-gray-900 mb-2">${book.title}</h3>
                                    <p class="text-sm text-gray-600 mb-1">by ${book.author}</p>
                                    <p class="text-xs text-gray-500 mb-3">ISBN: ${book.isbn}</p>
                                ` : '<p class="text-sm text-gray-600 mb-3">Library Fine</p>'}
                                <div class="border-t pt-3 mt-3 space-y-1 text-sm">
                                    <p><span class="font-medium">Fine Type:</span> ${fine.fine_type}</p>
                                    <p><span class="font-medium">Reason:</span> ${fine.reason || 'Late return'}</p>
                                    <p><span class="font-medium">Issued:</span> ${new Date(fine.created_at).toLocaleDateString()}</p>
                                    ${fine.paid_amount > 0 ? `
                                        <p><span class="font-medium">Paid:</span> ₱${fine.paid_amount.toFixed(2)}</p>
                                    ` : ''}
                                </div>
                                <div class="mt-4 pt-3 border-t">
                                    <p class="text-xs text-gray-500 mb-2">Please contact the library to make payment</p>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading unpaid fines:', error);
                document.getElementById('unpaidGrid').innerHTML = '<div class="text-center py-8 text-red-500 col-span-full">Error loading fines</div>';
            }
        }

        async function loadPaidFines() {
            try {
                // Get paid fines
                const { data: fines, error: finesError } = await supabase
                    .from('fines')
                    .select('*, borrow_records(*, books(*))')
                    .eq('member_id', currentUser.id)
                    .eq('status', 'paid')
                    .order('updated_at', { ascending: false })
                    .limit(20);

                if (finesError) throw finesError;

                // Get payment records
                const { data: payments, error: paymentsError } = await supabase
                    .from('payments')
                    .select('*')
                    .eq('member_id', currentUser.id)
                    .order('payment_date', { ascending: false })
                    .limit(20);

                if (paymentsError) throw paymentsError;

                const grid = document.getElementById('paidGrid');
                if ((!fines || fines.length === 0) && (!payments || payments.length === 0)) {
                    grid.innerHTML = '<div class="text-center py-8 text-gray-500 col-span-full"><i class="fas fa-inbox mr-2"></i>No payment history</div>';
                    return;
                }

                let html = '';

                // Display paid fines
                if (fines && fines.length > 0) {
                    html += fines.map(fine => {
                        const book = fine.borrow_records?.books;
                        
                        return `
                            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                                <div class="p-6">
                                    <div class="flex items-start justify-between mb-3">
                                        <span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-800">Paid</span>
                                        <span class="text-lg font-bold text-green-600">₱${fine.total_amount.toFixed(2)}</span>
                                    </div>
                                    ${book ? `
                                        <h3 class="text-lg font-bold text-gray-900 mb-2">${book.title}</h3>
                                        <p class="text-sm text-gray-600 mb-1">by ${book.author}</p>
                                    ` : '<p class="text-sm text-gray-600 mb-3">Library Fine</p>'}
                                    <div class="border-t pt-3 mt-3 space-y-1 text-sm">
                                        <p><span class="font-medium">Fine Type:</span> ${fine.fine_type}</p>
                                        <p><span class="font-medium">Paid:</span> ${new Date(fine.updated_at).toLocaleDateString()}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // Display payment records
                if (payments && payments.length > 0) {
                    html += payments.map(payment => {
                        return `
                            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                                <div class="p-6">
                                    <div class="flex items-start justify-between mb-3">
                                        <span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-800">Payment</span>
                                        <span class="text-lg font-bold text-blue-600">₱${payment.amount.toFixed(2)}</span>
                                    </div>
                                    <div class="space-y-1 text-sm">
                                        <p><span class="font-medium">Method:</span> ${payment.payment_method}</p>
                                        <p><span class="font-medium">Date:</span> ${new Date(payment.payment_date).toLocaleDateString()}</p>
                                        ${payment.reference_number ? `<p><span class="font-medium">Reference:</span> ${payment.reference_number}</p>` : ''}
                                        ${payment.notes ? `<p class="text-xs text-gray-500 mt-2">${payment.notes}</p>` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                grid.innerHTML = html;
            } catch (error) {
                console.error('Error loading paid fines:', error);
                document.getElementById('paidGrid').innerHTML = '<div class="text-center py-8 text-red-500 col-span-full">Error loading payment history</div>';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('border-blue-500', 'text-blue-600', 'border-red-500', 'text-red-600');
                btn.classList.add('border-transparent', 'text-gray-500');
            });
            
            if (tab === 'unpaid') {
                document.getElementById(`tab-${tab}`).classList.remove('border-transparent', 'text-gray-500');
                document.getElementById(`tab-${tab}`).classList.add('border-red-500', 'text-red-600');
            } else {
                document.getElementById(`tab-${tab}`).classList.remove('border-transparent', 'text-gray-500');
                document.getElementById(`tab-${tab}`).classList.add('border-blue-500', 'text-blue-600');
            }
            
            // Update content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            document.getElementById(`content-${tab}`).classList.remove('hidden');
        }
    </script>
</body>
</html>
