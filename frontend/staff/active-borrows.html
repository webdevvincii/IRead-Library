<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Borrows - Library Staff Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <button id="mobileMenuBtn" class="lg:hidden mr-3 text-white hover:text-indigo-200">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <i class="fas fa-book-reader text-2xl mr-3"></i>
                    <span class="font-bold text-lg sm:text-xl">Library Staff Portal</span>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <span id="staffName" class="text-xs sm:text-sm hidden sm:inline"></span>
                    <button onclick="logout()" class="bg-indigo-700 hover:bg-indigo-800 px-2 sm:px-4 py-2 rounded text-sm">
                        <i class="fas fa-sign-out-alt sm:mr-2"></i><span class="hidden sm:inline">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sidebar & Content -->
    <div class="flex">
        <!-- Mobile Menu Overlay -->
        <div id="mobileMenuOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"></div>
        
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out w-64 bg-white shadow-md min-h-screen z-50">
            <nav class="mt-6">
                <a href="dashboard.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-home w-6"></i>
                    <span class="ml-3">Dashboard</span>
                </a>
                <a href="books.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-book w-6"></i>
                    <span class="ml-3">Books</span>
                </a>
                <a href="borrow-requests.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-clipboard-list w-6"></i>
                    <span class="ml-3">Borrow Requests</span>
                </a>
                <a href="active-borrows.html" class="flex items-center px-6 py-3 text-indigo-600 bg-indigo-50 border-r-4 border-indigo-600">
                    <i class="fas fa-book-open w-6"></i>
                    <span class="ml-3">Active Borrows</span>
                </a>
                <a href="returns.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-undo w-6"></i>
                    <span class="ml-3">Returns</span>
                </a>
                <a href="members.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-users w-6"></i>
                    <span class="ml-3">Members</span>
                </a>
                <a href="fines.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-money-bill w-6"></i>
                    <span class="ml-3">Fines</span>
                </a>
                <a href="reports.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-chart-bar w-6"></i>
                    <span class="ml-3">Reports</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8">
            <div class="max-w-7xl mx-auto">
                <h1 class="text-3xl font-bold text-gray-800 mb-6">Active Borrows</h1>
                
                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-3 rounded-full bg-blue-100 text-blue-600">
                                <i class="fas fa-book-open text-2xl"></i>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm text-gray-600">Total Active</p>
                                <p id="totalActive" class="text-2xl font-bold text-gray-800">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-3 rounded-full bg-yellow-100 text-yellow-600">
                                <i class="fas fa-clock text-2xl"></i>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm text-gray-600">Due Soon (3 days)</p>
                                <p id="dueSoon" class="text-2xl font-bold text-gray-800">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-3 rounded-full bg-red-100 text-red-600">
                                <i class="fas fa-exclamation-triangle text-2xl"></i>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm text-gray-600">Overdue</p>
                                <p id="overdue" class="text-2xl font-bold text-gray-800">0</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="bg-white rounded-lg shadow p-6 mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                            <select id="statusFilter" class="w-full px-4 py-2 border rounded-lg">
                                <option value="">All Active</option>
                                <option value="active">Active</option>
                                <option value="overdue">Overdue</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Search</label>
                            <input type="text" id="searchInput" placeholder="Member name, book title..." class="w-full px-4 py-2 border rounded-lg">
                        </div>
                    </div>
                </div>

                <!-- Active Borrows Table -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Borrow #</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Member</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Book</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Borrow Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Due Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Days Left</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="borrowsTableBody" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="8" class="px-6 py-4 text-center text-gray-500">Loading...</td></tr>
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="js/staff-common.js"></script>
    <script src="js/mobile-menu.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const profile = await StaffCommon.checkAuth();
        if (profile) {
            StaffCommon.setupUserInfo(profile);
            StaffCommon.setupLogout();
        }
        loadBorrows();
        loadStats();
        document.getElementById('statusFilter').addEventListener('change', loadBorrows);
        document.getElementById('searchInput').addEventListener('input', loadBorrows);
    });

    async function loadStats() {
        try {
            const today = new Date().toISOString().split('T')[0];
            const threeDaysFromNow = new Date();
            threeDaysFromNow.setDate(threeDaysFromNow.getDate() + 3);
            const threeDaysDate = threeDaysFromNow.toISOString().split('T')[0];

            // Total active
            const { count: totalActive } = await supabase
                .from('borrow_records')
                .select('*', { count: 'exact', head: true })
                .in('status', ['active', 'overdue']);
            document.getElementById('totalActive').textContent = totalActive || 0;

            // Due soon (within 3 days)
            const { count: dueSoon } = await supabase
                .from('borrow_records')
                .select('*', { count: 'exact', head: true })
                .eq('status', 'active')
                .gte('due_date', today)
                .lte('due_date', threeDaysDate);
            document.getElementById('dueSoon').textContent = dueSoon || 0;

            // Overdue
            const { count: overdue } = await supabase
                .from('borrow_records')
                .select('*', { count: 'exact', head: true })
                .in('status', ['active', 'overdue'])
                .lt('due_date', today);
            document.getElementById('overdue').textContent = overdue || 0;

        } catch (error) {
            console.error('Error loading stats:', error);
        }
    }

    async function loadBorrows() {
        const status = document.getElementById('statusFilter').value;
        const search = document.getElementById('searchInput').value.toLowerCase();
        
        try {
            let query = supabase
                .from('borrow_records')
                .select(`
                    *,
                    member:profiles!member_id(full_name, member_id),
                    book:books(title, author, isbn)
                `)
                .in('status', ['active', 'overdue'])
                .order('due_date', { ascending: true });
            
            if (status === 'overdue') {
                const today = new Date().toISOString().split('T')[0];
                query = query.lt('due_date', today);
            } else if (status === 'active') {
                const today = new Date().toISOString().split('T')[0];
                query = query.gte('due_date', today);
            }
            
            const { data, error } = await query;
            if (error) throw error;
            
            let filtered = data || [];
            if (search) {
                filtered = filtered.filter(borrow => 
                    borrow.member?.full_name?.toLowerCase().includes(search) ||
                    borrow.book?.title?.toLowerCase().includes(search) ||
                    borrow.borrow_number?.toLowerCase().includes(search)
                );
            }
            
            displayBorrows(filtered);
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('borrowsTableBody').innerHTML = 
                `<tr><td colspan="8" class="px-6 py-4 text-center text-red-500">Error loading borrows</td></tr>`;
        }
    }

    function displayBorrows(borrows) {
        const tbody = document.getElementById('borrowsTableBody');
        if (borrows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="px-6 py-4 text-center text-gray-500">No active borrows found</td></tr>';
            return;
        }
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        tbody.innerHTML = borrows.map(borrow => {
            const dueDate = new Date(borrow.due_date);
            dueDate.setHours(0, 0, 0, 0);
            const timeDiff = dueDate - today;
            const daysLeft = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));
            
            let statusClass = 'bg-green-100 text-green-800';
            let statusText = 'Active';
            let daysLeftText = `${daysLeft} days`;
            
            if (daysLeft < 0) {
                statusClass = 'bg-red-100 text-red-800';
                statusText = 'Overdue';
                daysLeftText = `${Math.abs(daysLeft)} days overdue`;
            } else if (daysLeft <= 3) {
                statusClass = 'bg-yellow-100 text-yellow-800';
                statusText = 'Due Soon';
            }
            
            return `
                <tr class="${daysLeft < 0 ? 'bg-red-50' : ''}">
                    <td class="px-6 py-4 text-sm font-medium">${borrow.borrow_number}</td>
                    <td class="px-6 py-4 text-sm">
                        <div>${borrow.member?.full_name || 'N/A'}</div>
                        <div class="text-xs text-gray-500">${borrow.member?.member_id || 'N/A'}</div>
                    </td>
                    <td class="px-6 py-4 text-sm">
                        <div class="font-medium">${borrow.book?.title || 'N/A'}</div>
                        <div class="text-xs text-gray-500">${borrow.book?.author || 'N/A'}</div>
                    </td>
                    <td class="px-6 py-4 text-sm">${borrow.borrow_date}</td>
                    <td class="px-6 py-4 text-sm">${borrow.due_date}</td>
                    <td class="px-6 py-4 text-sm ${daysLeft < 0 ? 'text-red-600 font-bold' : daysLeft <= 3 ? 'text-yellow-600 font-medium' : ''}">${daysLeftText}</td>
                    <td class="px-6 py-4 text-sm">
                        <span class="px-2 py-1 text-xs rounded-full ${statusClass}">${statusText}</span>
                    </td>
                    <td class="px-6 py-4 text-sm">
                        <button onclick="deactivateBorrow('${borrow.id}')" class="text-red-600 hover:text-red-800">
                            <i class="fas fa-ban"></i> Deactivate
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    async function deactivateBorrow(id) {
        if (!confirm('Are you sure you want to deactivate this borrow record? This action cannot be undone.')) return;
        
        try {
            // Get the borrow record
            const { data: borrow, error: fetchError } = await supabase
                .from('borrow_records')
                .select('*, book_copy_id, borrow_date')
                .eq('id', id)
                .single();
            
            if (fetchError) throw fetchError;
            
            // Calculate proper return date (use current date or borrow date, whichever is later)
            const currentDate = new Date().toISOString().split('T')[0];
            const borrowDate = borrow.borrow_date;
            const returnDate = currentDate >= borrowDate ? currentDate : borrowDate;
            
            // Update borrow record status to cancelled/inactive
            const { error: updateError } = await supabase
                .from('borrow_records')
                .update({ 
                    status: 'returned',
                    return_date: returnDate
                })
                .eq('id', id);
            
            if (updateError) throw updateError;
            
            // Update book copy status back to available
            if (borrow.book_copy_id) {
                const { error: copyError } = await supabase
                    .from('book_copies')
                    .update({ status: 'available' })
                    .eq('id', borrow.book_copy_id);
                
                if (copyError) console.error('Error updating book copy:', copyError);
            }
            
            alert('Borrow record deactivated successfully!');
            loadBorrows();
            loadStats();
        } catch (error) {
            console.error('Error:', error);
            alert('Error: ' + error.message);
        }
    }

    function logout() {
        supabase.auth.signOut();
        localStorage.clear();
        window.location.href = 'login.html';
    }
    </script>
</body>
</html>
