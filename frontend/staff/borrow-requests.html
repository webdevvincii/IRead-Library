<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrow Requests - Library Staff Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <button id="mobileMenuBtn" class="lg:hidden mr-3 text-white hover:text-indigo-200">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <i class="fas fa-book-reader text-2xl mr-3"></i>
                    <span class="font-bold text-lg sm:text-xl">Library Staff Portal</span>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <span id="staffName" class="text-xs sm:text-sm hidden sm:inline"></span>
                    <button onclick="logout()" class="bg-indigo-700 hover:bg-indigo-800 px-2 sm:px-4 py-2 rounded text-sm">
                        <i class="fas fa-sign-out-alt sm:mr-2"></i><span class="hidden sm:inline">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sidebar & Content -->
    <div class="flex">
        <!-- Mobile Menu Overlay -->
        <div id="mobileMenuOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"></div>
        
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out w-64 bg-white shadow-md min-h-screen z-50">
            <nav class="mt-6">
                <a href="dashboard.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-home w-6"></i>
                    <span class="ml-3">Dashboard</span>
                </a>
                <a href="books.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-book w-6"></i>
                    <span class="ml-3">Books</span>
                </a>
                <a href="borrow-requests.html" class="flex items-center px-6 py-3 text-indigo-600 bg-indigo-50 border-r-4 border-indigo-600">
                    <i class="fas fa-clipboard-list w-6"></i>
                    <span class="ml-3">Borrow Requests</span>
                </a>
                <a href="active-borrows.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-book-open w-6"></i>
                    <span class="ml-3">Active Borrows</span>
                </a>
                <a href="returns.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-undo w-6"></i>
                    <span class="ml-3">Returns</span>
                </a>
                <a href="members.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-users w-6"></i>
                    <span class="ml-3">Members</span>
                </a>
                <a href="fines.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-money-bill w-6"></i>
                    <span class="ml-3">Fines</span>
                </a>
                <a href="reports.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-chart-bar w-6"></i>
                    <span class="ml-3">Reports</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8">
            <div class="max-w-7xl mx-auto">
                <h1 class="text-3xl font-bold text-gray-800 mb-6">Borrow Requests</h1>
                
                <!-- Filters -->
                <div class="bg-white rounded-lg shadow p-6 mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                            <select id="statusFilter" class="w-full px-4 py-2 border rounded-lg">
                                <option value="">All</option>
                                <option value="pending" selected>Pending</option>
                                <option value="approved">Approved</option>
                                <option value="rejected">Rejected</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Requests Table -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Request #</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Member</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Book</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Start Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Duration</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="requestsTableBody" class="bg-white divide-y divide-gray-200">
                            <tr><td colspan="7" class="px-6 py-4 text-center text-gray-500">Loading...</td></tr>
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="js/staff-common.js"></script>
    <script src="js/mobile-menu.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const profile = await StaffCommon.checkAuth();
        if (profile) {
            StaffCommon.setupUserInfo(profile);
            StaffCommon.setupLogout();
        }
        loadRequests();
        document.getElementById('statusFilter').addEventListener('change', loadRequests);
    });

    async function loadRequests() {
        const status = document.getElementById('statusFilter').value;
        try {
            let query = supabase
                .from('borrow_requests')
                .select(`
                    *,
                    member:profiles!member_id(full_name, member_id),
                    book:books(title, author, isbn)
                `)
                .order('created_at', { ascending: false });
            
            if (status) query = query.eq('status', status);
            
            const { data, error } = await query;
            if (error) throw error;
            displayRequests(data || []);
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('requestsTableBody').innerHTML = 
                `<tr><td colspan="7" class="px-6 py-4 text-center text-red-500">Error loading requests</td></tr>`;
        }
    }

    function displayRequests(requests) {
        const tbody = document.getElementById('requestsTableBody');
        if (requests.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-4 text-center text-gray-500">No requests found</td></tr>';
            return;
        }
        tbody.innerHTML = requests.map(req => `
            <tr>
                <td class="px-6 py-4 text-sm">${req.request_number}</td>
                <td class="px-6 py-4 text-sm">${req.member?.full_name || 'N/A'} (${req.member?.member_id || 'N/A'})</td>
                <td class="px-6 py-4 text-sm">${req.book?.title || 'N/A'}</td>
                <td class="px-6 py-4 text-sm">${req.requested_start_date}</td>
                <td class="px-6 py-4 text-sm">${req.requested_duration} days</td>
                <td class="px-6 py-4 text-sm">
                    <span class="px-2 py-1 text-xs rounded-full ${
                        req.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
                        req.status === 'approved' ? 'bg-green-100 text-green-800' :
                        'bg-red-100 text-red-800'
                    }">${req.status}</span>
                </td>
                <td class="px-6 py-4 text-sm">
                    ${req.status === 'pending' ? `
                        <button onclick="approveRequest('${req.id}')" class="text-green-600 hover:text-green-800 mr-2">
                            <i class="fas fa-check"></i> Approve
                        </button>
                        <button onclick="rejectRequest('${req.id}')" class="text-red-600 hover:text-red-800">
                            <i class="fas fa-times"></i> Reject
                        </button>
                    ` : '-'}
                </td>
            </tr>
        `).join('');
    }

    async function approveRequest(id) {
        if (!confirm('Approve this borrow request?')) return;
        try {
            // Get current staff user
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                alert('Please login as staff');
                return;
            }

            // Get the request details
            const { data: request, error: fetchError } = await supabase
                .from('borrow_requests')
                .select('*')
                .eq('id', id)
                .single();
            
            if (fetchError) throw fetchError;
            
            // Calculate due date (max 5 days based on member's requested duration)
            let duration = parseInt(request.requested_duration) || 5;
            if (duration > 5) duration = 5;
            
            const startDate = request.requested_start_date ? new Date(request.requested_start_date) : new Date();
            const dueDate = new Date(startDate);
            dueDate.setDate(dueDate.getDate() + duration);
            
            const borrowDateStr = startDate.toISOString().split('T')[0];
            const dueDateStr = dueDate.toISOString().split('T')[0];
            
            // Find an available copy of the book
            const { data: availableCopy, error: copyError } = await supabase
                .from('book_copies')
                .select('id')
                .eq('book_id', request.book_id)
                .eq('status', 'available')
                .limit(1)
                .single();
            
            if (copyError || !availableCopy) {
                alert('No available copy found for this book');
                return;
            }

            // Generate borrow number
            const now = new Date();
            const dateStr = now.toISOString().slice(0, 10).replace(/-/g, '');
            const randomNum = Math.floor(Math.random() * 9999).toString().padStart(4, '0');
            const borrowNumber = `BRW-${dateStr}-${randomNum}`;
            
            // Create borrow record
            const { error: borrowError } = await supabase
                .from('borrow_records')
                .insert({
                    borrow_number: borrowNumber,
                    request_id: request.id,
                    member_id: request.member_id,
                    book_id: request.book_id,
                    book_copy_id: availableCopy.id,
                    borrow_date: borrowDateStr,
                    due_date: dueDateStr,
                    issued_by: user.id,
                    status: 'active'
                });
            
            if (borrowError) throw borrowError;
            
            // Update book copy status
            const { error: updateCopyError } = await supabase
                .from('book_copies')
                .update({ status: 'borrowed' })
                .eq('id', availableCopy.id);
            
            if (updateCopyError) throw updateCopyError;
            
            // Update request status
            const { error: updateError } = await supabase
                .from('borrow_requests')
                .update({ status: 'approved', processed_at: new Date().toISOString() })
                .eq('id', id);
            
            if (updateError) throw updateError;
            
            alert('Request approved and borrow record created!');
            loadRequests();
        } catch (error) {
            console.error('Approve error:', error);
            alert('Error: ' + error.message);
        }
    }

    async function rejectRequest(id) {
        const reason = prompt('Rejection reason:');
        if (!reason) return;
        try {
            const { error } = await supabase
                .from('borrow_requests')
                .update({ 
                    status: 'rejected', 
                    rejection_reason: reason,
                    processed_at: new Date().toISOString() 
                })
                .eq('id', id);
            if (error) throw error;
            alert('Request rejected!');
            loadRequests();
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    function logout() {
        supabase.auth.signOut();
        localStorage.clear();
        window.location.href = 'login.html';
    }
    </script>
</body>
</html>
