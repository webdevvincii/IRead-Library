<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Library Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <button id="mobileMenuBtn" class="lg:hidden mr-3 text-white hover:text-indigo-200">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <i class="fas fa-book-reader text-2xl mr-3"></i>
                    <span class="font-bold text-lg sm:text-xl">Library Staff Portal</span>
                </div>
                <div class="flex items-center space-x-2 sm:space-x-4">
                    <span id="staffName" class="text-xs sm:text-sm hidden sm:inline"></span>
                    <button onclick="logout()" class="bg-indigo-700 hover:bg-indigo-800 px-2 sm:px-4 py-2 rounded text-sm">
                        <i class="fas fa-sign-out-alt sm:mr-2"></i><span class="hidden sm:inline">Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sidebar & Content -->
    <div class="flex">
        <!-- Mobile Menu Overlay -->
        <div id="mobileMenuOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"></div>
        
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out w-64 bg-white shadow-md min-h-screen z-50">
            <nav class="mt-6">
                <a href="dashboard.html" class="flex items-center px-6 py-3 text-indigo-600 bg-indigo-50 border-r-4 border-indigo-600">
                    <i class="fas fa-home w-6"></i>
                    <span class="ml-3">Dashboard</span>
                </a>
                <a href="books.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-book w-6"></i>
                    <span class="ml-3">Books</span>
                </a>
                <a href="borrow-requests.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-clipboard-list w-6"></i>
                    <span class="ml-3">Borrow Requests</span>
                </a>
                <a href="active-borrows.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-book-open w-6"></i>
                    <span class="ml-3">Active Borrows</span>
                </a>
                <a href="returns.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-undo w-6"></i>
                    <span class="ml-3">Returns</span>
                </a>
                <a href="members.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-users w-6"></i>
                    <span class="ml-3">Members</span>
                </a>
                <a href="fines.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-money-bill w-6"></i>
                    <span class="ml-3">Fines</span>
                </a>
                <a href="reports.html" class="flex items-center px-6 py-3 text-gray-700 hover:bg-indigo-50">
                    <i class="fas fa-chart-bar w-6"></i>
                    <span class="ml-3">Reports</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8">
            <div class="max-w-7xl mx-auto">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4 mb-8">
            <!-- Total Books -->
            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-blue-500 rounded-md p-3">
                            <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                            </svg>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Total Books</dt>
                                <dd class="text-2xl font-semibold text-gray-900" id="totalBooks">-</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Active Borrows -->
            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-green-500 rounded-md p-3">
                            <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Active Borrows</dt>
                                <dd class="text-2xl font-semibold text-gray-900" id="activeBorrows">-</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pending Requests -->
            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-yellow-500 rounded-md p-3">
                            <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Pending Requests</dt>
                                <dd class="text-2xl font-semibold text-gray-900" id="pendingRequests">-</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Overdue Books -->
            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-red-500 rounded-md p-3">
                            <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                            </svg>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Overdue Books</dt>
                                <dd class="text-2xl font-semibold text-gray-900" id="overdueBooks">-</dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="grid grid-cols-1 gap-5 lg:grid-cols-2">
            <!-- Recent Borrow Requests -->
            <div class="bg-white shadow rounded-lg">
                <div class="px-4 py-5 sm:p-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">
                        Recent Borrow Requests
                    </h3>
                    <div id="recentRequests" class="space-y-3">
                        <div class="text-center py-8 text-gray-500">Loading...</div>
                    </div>
                    <div class="mt-4">
                        <a href="borrow-requests.html" class="text-sm font-medium text-blue-600 hover:text-blue-500">
                            View all requests →
                        </a>
                    </div>
                </div>
            </div>

            <!-- Overdue Items -->
            <div class="bg-white shadow rounded-lg">
                <div class="px-4 py-5 sm:p-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">
                        Overdue Items
                    </h3>
                    <div id="overdueItems" class="space-y-3">
                        <div class="text-center py-8 text-gray-500">Loading...</div>
                    </div>
                    <div class="mt-4">
                        <a href="returns.html" class="text-sm font-medium text-blue-600 hover:text-blue-500">
                            View all overdue →
                        </a>
                    </div>
                </div>
            </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="js/staff-common.js"></script>
    <script src="js/staff-dashboard.js"></script>
    <script src="js/mobile-menu.js"></script>
</body>
</html>
